[package]
name = "centaeris-runtime-sqlite"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "Apache-2.0"
repository.workspace = true
description = "Centaeris SQLite RuntimeStore adapter"

[lints]
workspace = true

[dependencies]
centaeris-core.workspace = true
rusqlite.workspace = true
serde_json.workspace = true
sha2.workspace = true
zstd.workspace = true

[dev-dependencies]
tempfile = "=3.27.0"
rusqlite = { workspace = true, features = ["hooks"] }
thiserror = "=2.0.18"
tokio-rusqlite = { version = "=0.6.0", features = ["bundled"] }
tokio-util = { version = "=0.7.18", features = ["rt"] }
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "sync", "time"] }

[[example]]
name = "sqlite_abort"
test = false
