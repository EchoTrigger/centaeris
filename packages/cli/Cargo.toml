[package]
name = "centaeris-tui"
version.workspace = true
description = "Centaeris interactive and headless CLI"
authors = ["EchoTrigger"]
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
default-run = "cet"

[lints]
workspace = true

[[bin]]
name = "cet"
path = "src/main.rs"

[dependencies]
arboard.workspace = true
base64.workspace = true
centaeris-core.workspace = true
centaeris-agent = { path = "../agent" }
centaeris-cli-runtime = { workspace = true, features = ["native-job-store"] }
crossterm.workspace = true
getrandom.workspace = true
image.workspace = true
pulldown-cmark = { version = "=0.13.4", default-features = false }
ratatui = { workspace = true, features = ["scrolling-regions", "unstable-backend-writer", "unstable-rendered-line-info"] }
ratatui-image.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync"] }
unicode-width = "=0.2.0"
unicode-segmentation = "=1.13.3"

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
centaeris-cli-runtime = { workspace = true, features = ["test-support"] }
