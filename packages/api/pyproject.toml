[project]
name = "api"
version = "0.1.0"
license = "AGPL-3.0-only"
requires-python = "==3.12.10"
dependencies = [
  "argon2-cffi==23.1.0",
  "anthropic==0.104.1",
  "asgiref==3.12.1",
  "cryptography==49.0.0",
  "Django==5.2.16",
  "django-cors-headers==4.9.0",
  "django-ninja==1.6.2",
  "docker==7.2.0",
  "jsonschema==4.26.0",
  "mcp==2.2.0",
  "openai==2.45.0",
  "pillow==12.3.0",
  "pydantic==2.13.4",
  "psycopg[binary]==3.3.4",
  "psycopg-pool==3.3.3",
  "redis==5.3.1",
  "starlette==1.6.0",
  "uvicorn==0.51.0",
]

[dependency-groups]
dev = ["httpx==0.28.1"]

[tool.setuptools.packages.find]
include = ["api*", "app_core*"]

[tool.setuptools.package-data]
app_core = ["generated/*.json", "contracts/*.json"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "api.settings"

[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"
