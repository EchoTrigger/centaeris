map $http_x_forwarded_proto $centaeris_forwarded_proto {
    default $http_x_forwarded_proto;
    "" $scheme;
}

# Query strings and referrers can contain OAuth authorization codes. Keep the
# request path and response status useful without retaining those credentials.
log_format centaeris_safe '$remote_addr - $remote_user [$time_local] '
    '"$request_method $uri $server_protocol" $status $body_bytes_sent '
    '"$http_user_agent"';

server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    access_log /var/log/nginx/access.log centaeris_safe;
    client_max_body_size ${UPLOAD_BODY_MAX_BYTES};

    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $centaeris_forwarded_proto;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location = /config.json {
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-store" always;
        try_files $uri $uri/ /index.html;
    }
}
