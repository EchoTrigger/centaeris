reqwest = { workspace = true, features = ["rustls-tls", "socks"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["time"] }

[dev-dependencies]
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt", "test-util"] }
