[workspace]
resolver = "2"
members = [
  "packages/core",
  "packages/mcp",
  "packages/runtime_sqlite",
  "packages/runtime",
  "packages/tui",
  "packages/model-catalog",
]

[workspace.package]
version = "1.0.0"
edition = "2021"
rust-version = "1.94.1"
license = "AGPL-3.0-only"
repository = "https://github.com/EchoTrigger/centaeris"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
correctness = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }
perf = { level = "deny", priority = -1 }
await_holding_lock = "deny"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"

[workspace.dependencies]
arboard = "=3.6.1"
axum = { version = "=0.8.9", default-features = false }
base64 = "=0.22.1"
chrono = { version = "=0.4.45", default-features = false, features = ["clock", "std"] }
crossterm = "=0.28.1"
fs2 = "=0.4.3"
futures = "=0.3.32"
getrandom = "=0.4.3"
hmac = "=0.12.1"
image = { version = "=0.25.9", default-features = false, features = ["jpeg", "png", "webp"] }
libc = "=0.2.186"
ratatui = "=0.29.0"
ratatui-image = { version = "=8.1.1", default-features = false }
reqwest = { version = "=0.12.28", default-features = false }
rmcp = { version = "=3.1.4", default-features = false, features = ["client", "reqwest", "transport-child-process", "transport-streamable-http-client-reqwest"] }
rusqlite = { version = "=0.32.1", features = ["bundled"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
sha2 = "=0.10.9"
sse-stream = "=0.2.5"
tokio = "=1.52.3"
toml = "=1.1.4"
tree-sitter = "=0.25.10"
tree-sitter-bash = "=0.25.1"
unicode-normalization = "=0.1.25"
url = "=2.5.8"
windows-sys = "=0.59.0"
zstd = "=0.13.3"

[workspace.dependencies.centaeris-core]
path = "packages/core"

[workspace.dependencies.centaeris-model-catalog]
path = "packages/model-catalog"
version = "=1.0.0"

[workspace.dependencies.centaeris-mcp]
path = "packages/mcp"

[workspace.dependencies.centaeris-runtime-sqlite]
path = "packages/runtime_sqlite"

[profile.tui-release]
inherits = "release"
codegen-units = 1
lto = true
opt-level = "z"
panic = "abort"
strip = "symbols"
