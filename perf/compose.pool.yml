# Connection-pool validation only: actual serving-process instrumentation and a fixed resource budget.
services:
  api:
    image: centaeris-perf-api-pool:local
    build:
      context: ./perf/harness
      dockerfile: Pool.Dockerfile
    entrypoint: ["uvicorn", "pool_probe:application", "--host", "0.0.0.0", "--port", "8000", "--workers", "1"]
    environment:
      API_WORKERS: "1"
    cpus: 2
    mem_limit: 1g
  postgres:
    cpus: 2
    mem_limit: 1g
    command: ["postgres", "-c", "shared_preload_libraries=pg_stat_statements", "-c", "log_connections=on"]
  runtime:
    cpus: 2
    mem_limit: 2g
  worker:
    cpus: 1
    mem_limit: 512m
    environment:
      WORKER_SLOT_COUNT: "2"
  redis:
    cpus: 0.5
    mem_limit: 256m
  mock-model:
    cpus: 0.5
    mem_limit: 128m
