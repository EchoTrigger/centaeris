name: Hosted Performance

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/workspace-performance.yml
      - scripts/workspace/core-source*.mjs
      - scripts/workspace/rust-toolchain.test.mjs
      - Cargo.lock
      - Cargo.toml
      - rust-toolchain.toml
      - docs/workspace/eval/fixtures/performance-repair-v1.json
      - packages/runtime_server/Cargo.toml
      - packages/runtime_server/src/postgres_store.rs
      - packages/runtime_server/src/postgres_store/**
      - scripts/workspace/performance-eval*.mjs
  push:
    branches:
      - main
    paths:
      - .github/workflows/workspace-performance.yml
      - scripts/workspace/core-source*.mjs
      - scripts/workspace/rust-toolchain.test.mjs
      - Cargo.lock
      - Cargo.toml
      - rust-toolchain.toml
      - docs/workspace/eval/fixtures/performance-repair-v1.json
      - packages/runtime_server/Cargo.toml
      - packages/runtime_server/src/postgres_store.rs
      - packages/runtime_server/src/postgres_store/**
      - scripts/workspace/performance-eval*.mjs

permissions:
  contents: read

concurrency:
  group: performance-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  observation-storage:
    name: Observation storage evaluation
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out Workspace
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.21.0

      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          rustup show active-toolchain
          node --test scripts/workspace/rust-toolchain.test.mjs

      - name: Run observation storage evaluation
        shell: bash
        run: node scripts/workspace/performance-eval.mjs
