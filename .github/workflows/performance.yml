name: Performance

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/performance.yml
      - Cargo.lock
      - Cargo.toml
      - rust-toolchain.toml
      - packages/runtime/Cargo.toml
      - packages/runtime/src/message_log.rs
      - packages/runtime/src/message_log/**
  push:
    branches:
      - main
    paths:
      - .github/workflows/performance.yml
      - Cargo.lock
      - Cargo.toml
      - rust-toolchain.toml
      - packages/runtime/Cargo.toml
      - packages/runtime/src/message_log.rs
      - packages/runtime/src/message_log/**

permissions:
  contents: read

concurrency:
  group: performance-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  observation-storage:
    name: Observation storage growth
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.94.1 --profile minimal

      - name: Run observation storage growth gate
        run: >-
          cargo test --locked -p centaeris-runtime
          message_log::observation_cas::tests::observation_manifest_growth_is_linear_with_early_changes_through_4095_observations
          -- --ignored --exact --nocapture --test-threads=1
