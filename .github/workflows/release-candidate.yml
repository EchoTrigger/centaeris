name: Release Candidate

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-candidate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows-x64:
    name: Windows x64 release candidate
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.21.0
          cache: npm

      - name: Select Git Bash
        shell: pwsh
        run: |
          $gitBash = Join-Path $env:ProgramFiles "Git\bin\bash.exe"
          if (-not (Test-Path -LiteralPath $gitBash)) {
            throw "Git Bash is required at $gitBash"
          }

          (Split-Path -Parent $gitBash) | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "CENTAERIS_TEST_BASH_PATH=$gitBash" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          & $gitBash --version

      - name: Show locked toolchains
        shell: pwsh
        run: |
          node --version
          npm --version
          rustc --version
          cargo --version

      - name: Run full release gate
        shell: pwsh
        run: .\scripts\ci.ps1

      - name: Run observation storage growth gate
        shell: pwsh
        run: >-
          cargo test --locked -p centaeris-runtime
          message_log::observation_cas::tests::observation_manifest_growth_is_linear_with_early_changes_through_4095_observations
          -- --ignored --exact --nocapture --test-threads=1

      - name: Package release candidate
        shell: pwsh
        run: |
          $candidateDir = Join-Path $PWD "dist/release-candidate"
          New-Item -ItemType Directory -Path $candidateDir -Force | Out-Null

          $desktopDist = Join-Path $PWD "packages/desktop/dist/Centaeris Desktop"
          $desktopArchive = Join-Path $candidateDir "centaeris-desktop-windows-x64.zip"
          Compress-Archive -LiteralPath $desktopDist -DestinationPath $desktopArchive -CompressionLevel Optimal

          Copy-Item -LiteralPath "packages/tui/dist/centaeris-windows-x64.zip" -Destination $candidateDir
          git archive --format=zip --prefix=centaeris/ --output="$candidateDir/centaeris-source.zip" HEAD
          if ($LASTEXITCODE -ne 0) {
            throw "Source archive failed"
          }

          Get-ChildItem -LiteralPath $candidateDir | Select-Object Name, Length

      - name: Upload release candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: centaeris-windows-x64-${{ github.sha }}
          path: dist/release-candidate/*.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
