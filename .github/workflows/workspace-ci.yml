name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  resolve-core:
    uses: ./.github/workflows/resolve-core-revision.yml

  source-static:
    name: Source and web static gate
    needs: resolve-core
    env:
      CENTAERIS_CORE_REVISION: ${{ needs.resolve-core.outputs.revision }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    services:
      postgres-test:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: centaeris
          POSTGRES_USER: centaeris
          POSTGRES_PASSWORD: centaeris
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U centaeris -d centaeris"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    defaults:
      run:
        working-directory: centaeris-workspace
    steps:
      - name: Check out Workspace
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: centaeris-workspace
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.21.0
          cache: npm
          cache-dependency-path: centaeris-workspace/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: 3.12.10

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: 0.11.6
          enable-cache: true
          cache-dependency-glob: centaeris-workspace/uv.lock

      - name: Set up Rust
        shell: bash
        run: |
          rustup show active-toolchain

      - name: Run source and web static gate
        run: python scripts/ci.py --skip-frontend-tests

  docker-fresh-start:
    name: Docker fresh-start gate
    needs: resolve-core
    env:
      CENTAERIS_CORE_REVISION: ${{ needs.resolve-core.outputs.revision }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    defaults:
      run:
        working-directory: centaeris-workspace
    steps:
      - name: Check out Workspace
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: centaeris-workspace
          persist-credentials: false

      - name: Install and verify pinned runsc on the disposable runner
        shell: bash
        run: |
          set -euo pipefail
          # Full release includes the shim and gvisor-bin sidecars required by runsc.
          # https://gvisor.dev/docs/user_guide/install/
          archive="${RUNNER_TEMP}/gvisor-x86_64.tar.zstd"
          curl --fail --silent --show-error --location \
            https://github.com/google/gvisor/releases/download/release-20260921.0/gvisor-x86_64.tar.zstd \
            --output "$archive"
          echo "e3e7776afd36b08431c668a60f4271f9e9787ce0def960be680acb1681af3861  $archive" | sha256sum --check
          sudo tar --zstd --extract --file "$archive" --directory /usr/local/bin
          /usr/local/bin/runsc --version
          sudo /usr/local/bin/runsc install -- --platform=systrap
          sudo systemctl reload docker
          docker info --format '{{json .Runtimes}}'
          docker run --rm --runtime=runsc hello-world@sha256:d1a8d0a4eeb63aff09f5f34d4d80505e0ba81905f36158cc3970d8e07179e59e

      - name: Build and start the complete stack from empty volumes
        shell: bash
        env:
          CENTAERIS_CI_DESTRUCTIVE_DOCKER: "1"
          CENTAERIS_WORKSPACE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
        run: ./scripts/docker-release-gate.sh
